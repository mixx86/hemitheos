[package]
name = "hemitheos"
version = "0.1.0"
edition = "2024"
license = "MIT"

[package.metadata]
supported-targets = [
    "aarch64-unknown-none",
    "riscv64gc-unknown-none-elf",
]

[lib]
name = "hemitheos"
path = "src/lib.rs"

[[bin]]
name = "hemitheos"
path = "src/main.rs"
test = false
required-features = ["bin-target"]

[features]
bin-target = []

[build-dependencies]
cc = "1.0"

[dependencies]
fdt = { version = "0.1", default-features = false }


[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
