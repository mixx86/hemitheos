name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rust ARM64 target
        run: rustup target add aarch64-unknown-none

      - name: Build (release)
        run: ./scripts/build.sh

      - name: Test (native)
        run: ./scripts/test.sh --verbose

      - name: QEMU smoke test
        run: |
          timeout 10 ./scripts/qemu-run.sh 2>&1 | tee /tmp/qemu-out.txt || true
          grep -q "Hemitheos" /tmp/qemu-out.txt \
            || { echo "ERROR: expected boot output not found"; cat /tmp/qemu-out.txt; exit 1; }

      - name: Lint (clippy)
        env:
          TARGET_CC: aarch64-linux-gnu-gcc
        run: cargo clippy --features bin-target --target aarch64-unknown-none -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Dependency check (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
