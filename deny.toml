[advisories]
version = 2
# Deny crates with known security vulnerabilities.
deny = ["unmaintained", "unsound", "yanked"]

[licenses]
version = 2
# Allowed licenses for all dependencies.
# MPL-2.0: fdt crate. Weak copyleft — changes to fdt source must be shared,
# but the hypervisor code linking against it is not affected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]

[bans]
version = 2
# Deny multiple versions of the same crate in the dependency graph.
multiple-versions = "deny"

[sources]
version = 2
# Only allow dependencies from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
