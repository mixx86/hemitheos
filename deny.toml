[advisories]
# All advisories (vulnerabilities, unsound code, yanked crates) are denied by
# default in cargo-deny 0.14+. Add RUSTSEC IDs here only to explicitly ignore
# a known advisory with justification.
ignore = []

[licenses]
# MPL-2.0: fdt crate. Weak copyleft — changes to fdt source must be shared,
# but the hypervisor code linking against it is not affected.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
]

[bans]
multiple-versions = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
